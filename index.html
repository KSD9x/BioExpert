<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 550px;
            width: 100%;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #a0a8c0;
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn-link {
            display: block;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
            overflow: hidden;
            border: none;
            outline: none;
        }

        /* Кнопка 1: Biostat_Expert */
        .btn-biostat {
            background: linear-gradient(135deg, #00c6a7 0%, #00e396 100%);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(0, 198, 167, 0.35);
        }

        .btn-biostat:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(0, 198, 167, 0.5);
        }

        .btn-biostat:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 198, 167, 0.4);
        }

        /* Кнопка 2: BIostat_Expert */
        .btn-biostat-cap {
            background: linear-gradient(135deg, #6c5ce7 0%, #a855f7 100%);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.35);
        }

        .btn-biostat-cap:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(108, 92, 231, 0.5);
        }

        .btn-biostat-cap:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.4);
        }

        /* Эффект блика при наведении */
        .btn-link::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(25deg);
            transition: left 0.6s ease;
        }

        .btn-link:hover::after {
            left: 120%;
        }

        .btn-badge {
            display: inline-block;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 8px;
            font-weight: 400;
            letter-spacing: 0.5px;
            vertical-align: middle;
        }

        .btn-biostat-cap .btn-badge {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
                border-radius: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .btn-link {
                padding: 14px 24px;
                font-size: 15px;
            }

            .icon {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Иконка -->
        <div class="icon">📊</div>

        <!-- Заголовок -->
        <h1>Экзамен по R Статистике 2026</h1>
        <p class="subtitle">Выберите нужный раздел для продолжения</p>

        <!-- Кнопки -->
        <div class="buttons-wrapper">
            <!-- Кнопка 1: Biostat_Expert (строчная i) -->
            <a href="Biostat_Expert.html" class="btn-link btn-biostat">
                📗 Экзамен
                <span class="btn-badge">Основной</span>
            </a>

            <!-- Кнопка 2: BIostat_Expert (заглавная I) -->
            <a href="BIostat_Expert.html" class="btn-link btn-biostat-cap">
                📘 Ответы
                <span class="btn-badge">Расширенный</span>
            </a>
        </div>
    </div>

</body>
</html>
