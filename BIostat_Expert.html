<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База вопросов и ответов</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --correct: #00b894;
            --correct-bg: #e6f9f4;
            --correct-border: #00b894;
            --wrong: #e17055;
            --wrong-bg: #fef0ed;
            --wrong-border: #e17055;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Search */
        .search-wrapper {
            position: relative;
            margin-bottom: 28px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            font-size: 1rem;
            border: 2px solid transparent;
            border-radius: var(--radius);
            background: var(--card-bg);
            box-shadow: var(--shadow);
            outline: none;
            transition: var(--transition);
            color: var(--text);
        }
        .search-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 5px rgba(108, 92, 231, 0.08), var(--shadow-hover);
        }
        .search-wrapper input::placeholder {
            color: #b2bec3;
        }
        .search-wrapper .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            pointer-events: none;
            opacity: 0.5;
            transition: var(--transition);
        }
        .search-wrapper input:focus+.search-icon {
            opacity: 1;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .stat-chip {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .stat-chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.correct {
            background: var(--correct);
        }
        .dot.wrong {
            background: var(--wrong);
        }
        .dot.total {
            background: var(--accent);
        }

        /* Results */
        .results-count {
            margin-bottom: 16px;
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .results-count span {
            color: var(--accent);
            font-weight: 700;
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .no-results .big-emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }
        .no-results p {
            font-size: 1.1rem;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-left: 5px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .card.match-high {
            border-left-color: var(--accent);
        }
        .card .question {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
            letter-spacing: -0.2px;
        }
        .card .question .q-label {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 50px;
            margin-right: 10px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Answer groups */
        .answers-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .answer-group-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
        }
        .answer-group-label.correct-label {
            color: var(--correct);
        }
        .answer-group-label.wrong-label {
            color: var(--wrong);
        }
        .answer-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 4px;
        }
        .answer-tag {
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            cursor: default;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .answer-tag.correct {
            background: var(--correct-bg);
            color: #007a5e;
            border: 1.5px solid var(--correct-border);
        }
        .answer-tag.correct::before {
            content: '✓';
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--correct);
        }
        .answer-tag.wrong {
            background: var(--wrong-bg);
            color: #a03a20;
            border: 1.5px solid var(--wrong-border);
        }
        .answer-tag.wrong::before {
            content: '✗';
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--wrong);
        }
        .answer-tag:hover {
            transform: scale(1.04);
            cursor: default;
        }

        /* Highlight match */
        .highlight {
            background: #ffeaa7;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            color: #2d3436;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 0 4px;
            }
            .card {
                padding: 18px 16px;
                border-radius: var(--radius-sm);
            }
            .card .question {
                font-size: 1rem;
            }
            .answer-tag {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .search-wrapper input {
                padding: 14px 44px 14px 16px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">📚</div>
            <h1>База вопросов и ответов</h1>
            <p class="subtitle">Поиск по вопросам с подсветкой верных и неверных ответов</p>
        </div>

        <!-- Search -->
        <div class="search-wrapper">
            <input
            type="text"
            id="searchInput"
            placeholder="🔍  Введите часть вопроса для поиска..."
            autocomplete="off"
            >
            <span class="search-icon">🔎</span>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsContainer">
            <div class="stat-chip">
                <span class="dot total"></span> Всего: <strong id="statTotal">0</strong>
            </div>
            <div class="stat-chip">
                <span class="dot correct"></span> Верных ответов: <strong id="statCorrect">0</strong>
            </div>
            <div class="stat-chip">
                <span class="dot wrong"></span> Неверных ответов: <strong id="statWrong">0</strong>
            </div>
            <div class="stat-chip">
                📋 Показано: <strong id="statShown">0</strong>
            </div>
        </div>

        <!-- Results count -->
        <div class="results-count" id="resultsCount"></div>

        <!-- Cards container -->
        <div id="cardsContainer"></div>

        <!-- No results -->
        <div class="no-results" id="noResults" style="display: none;">
            <span class="big-emoji">🤷</span>
            <p>Ничего не найдено</p>
            <p style="font-size: 0.9rem; color: #b2bec3;">Попробуйте изменить поисковый запрос</p>
        </div>
    </div>

        { q: "При оценке токсичности препаратов, что означает аббревиатура LD50?", c:["Медианная летальная доза: доза, вызывающая гибель 50% подопытных животных."], w:["Доза, при которой выживает 50% паразитов.", "Доза, безопасная для 50 видов животных.", "Линейная девиация 50-го перцентиля.", "Логистический девианс с 50 степенями свободы."] },
        { q: "Что произойдет, если в функцию lm() передать фактор (текстовую колонку) с 4 уникальными породами коров в качестве предиктора?", c:["R выберет одну породу как базовую (Intercept), а для остальных трех создаст фиктивные переменные (Dummy) со значениями 0 и 1."], w:["R выдаст ошибку, так как lm() принимает только числа.", "R автоматически переведет текст в числа от 1 до 4 и посчитает их как количественный признак.", "R удалит эту колонку из анализа.", "R запустит непараметрический тест Крускала-Уоллиса."] },

        // ================= МЕТОД ГЛАВНЫХ КОМПОНЕНТ (PCA / PCoA) (15 вопросов) =================
        { q: "Какова основная математическая задача Метода Главных Компонент (PCA)?", c:["Сжатие размерности многомерных данных путем поиска ортогональных осей, описывающих максимальную долю дисперсии."], w:["Поиск статистически значимых различий между группами (p < 0.05).", "Предсказание категориального отклика (1/0).", "Аппроксимация нелинейной кривой полиномом 3-й степени.", "Выявление выбросов с помощью расстояния Кука."] },
        { q: "Что представляют собой 'Главные Компоненты' (PC1, PC2...)?", c:["Линейные комбинации исходных признаков."], w:["Случайно выбранные столбцы из исходной таблицы.", "Логарифмированные значения исходных переменных.", "Ранги исходных признаков.", "Остатки от множественной линейной регрессии."] },
        { q: "Какая компонента в PCA всегда забирает (объясняет) наибольшую долю дисперсии исходных данных?", c: ["Первая главная компонента (PC1)."], w:["Последняя главная компонента.", "Вторая главная компонента (PC2).", "Они все объясняют ровно одинаковую долю дисперсии.", "Та, которая сильно коррелирует с категориальными факторами."] },
        { q: "Почему применение PCA к нестандартизированным данным (где один признак измеряется в тысячах, а другой в сотых долях) является грубой ошибкой?", c:["Признаки с большими абсолютными значениями и дисперсией (например, вес в кг) математически подавят признаки с малыми значениями (например, жир в %)."], w:["Матрица ковариаций не сможет быть вычислена (ошибка деления на ноль).", "Все точки на графике сольются в одну линию.", "Векторы (стрелки) на биплоте изменят свое направление на противоположное.", "PCA работает только с бинарными переменными."] },
        { q: "Какой график используется в PCA для визуального определения оптимального числа оставляемых компонент ('поиск локтя')?", c:["График каменистой осыпи (Scree plot)."], w:["Лесной график (Forest plot).", "Диаграмма Кливленда.", "Скрипичная диаграмма (Violin plot).", "График остатков Шёнфельда."] },
        { q: "В таблице 'Факторные нагрузки' (Factor Loadings) значение признака 'Удой' для оси PC1 равно -0.98. Это означает:", c:["Признак 'Удой' имеет мощнейшую обратную корреляцию с осью PC1 и является ее главным 'формирователем'."], w:["Признак 'Удой' вообще не несет информации для оси PC1.", "Признак 'Удой' нужно удалить из-за мультиколлинеарности.", "Ось PC1 описывает 98% дисперсии признака 'Удой'.", "Это невозможная ситуация, нагрузки всегда положительные."] },
        { q: "Что отображает 'Биплот' (Biplot) в методе главных компонент?", c:["Совмещенное отображение точек (индивидуумов) и векторов (исходных признаков) в пространстве главных компонент."], w:["Распределение остатков регрессии в 2D и 3D.", "Два разных дерева иерархической кластеризации.", "Только круговые диаграммы двух главных компонент.", "Сравнение ROC-кривых двух разных моделей."] },
        { q: "Как интерпретировать угол между двумя векторами (стрелками) на биплоте PCA?", c:["Острый угол (около 0°) означает сильную положительную корреляцию.", "Прямой угол (~90°) означает отсутствие корреляции.", "Развернутый угол (~180°) означает сильную отрицательную корреляцию."], w:["Острый угол означает, что признаки независимы.", "Угол показывает процент объясненной дисперсии."] },
        { q: "Если вектор признака на корреляционном круге (Variables factor map) очень короткий (не достает до границы круга), это означает:", c:["Этот признак плохо представлен (объясняется) на текущих двух осях (он проецируется 'вглубь' других измерений)."], w:["Этот признак является самым важным для всего анализа.", "Этот признак имеет нулевую дисперсию.", "Это признак-выброс.", "Признак мультиколлинеарен всем остальным."] },
        { q: "Какие популярные R-пакеты используются как современный стандарт для вычислений и красивой визуализации PCA?", c:["FactoMineR", "factoextra"], w:["lme4 и nlme", "survival и survminer", "car и MASS"] },
        { q: "В чем фундаментальное отличие PCoA (Метод Главных Координат / MDS) от PCA?", c:["PCoA принимает на вход готовую МАТРИЦУ РАССТОЯНИЙ (дистанций), в то время как PCA работает непосредственно с исходной таблицей признаков.", "PCoA позволяет использовать любые специфические неевклидовы метрики (например, Жаккара или Брея-Кёртиса)."], w:["PCoA используется только для прогнозирования, а PCA — для кластеризации.", "PCoA не позволяет визуализировать данные в 2D.", "PCoA работает только с текстом."] },
        { q: "Для каких данных в биологии (микробиом, генетика) Евклидово расстояние часто неприменимо, и требуется переход к PCoA?", c:["Для бинарных данных (наличие/отсутствие видов, 0 и 1), так как Евклидово расстояние учитывает 'совместные нули' как сходство."], w:["Для классических физических промеров (рост, вес, объем).", "Для нормально распределенных непрерывных данных.", "Для счетных данных (распределение Пуассона).", "Для временных рядов (анализ выживаемости)."] },
        { q: "Что делает функция `cmdscale()` в базовом R?", c:["Выполняет классическое многомерное шкалирование (PCoA), преобразуя матрицу расстояний в координаты на плоскости."], w:["Строит дендрограмму.", "Вычисляет матрицу расстояний Пирсона.", "Стандартизирует данные (Z-score).", "Рисует 3D интерактивный график."] },
        { q: "В отличие от PCA, PCoA 'из коробки' не дает факторных нагрузок (стрелок) для исходных признаков. Как их добавить на график?", c:["Использовать функцию `envfit()` (пакет vegan) для регрессии исходных признаков на полученные координаты PCoA."], w:["Это невозможно сделать математически.", "Просто нарисовать стрелки случайным образом.", "Включить аргумент `loadings = TRUE` в `dist()`.", "Использовать преобразование Бокса-Кокса."] },
        { q: "Что такое 'Ординация' (Ordination) в контексте биостатистики?", c:["Размещение объектов в пространстве пониженной размерности (1D, 2D, 3D) так, чтобы расстояние между ними отражало степень их экологического или генетического сходства."], w:["Процедура удаления всех выбросов перед регрессией.", "Метод замены пропущенных данных (NA) медианами.", "Проверка данных на нормальность.", "Слияние мелких кластеров в один гигантский."] },

        { q: "В чем заключается задача Кластерного анализа (обучения 'без учителя')?", c:["Разбиение множества объектов на группы так, чтобы объекты внутри группы были максимально похожи, а группы между собой — максимально различны."], w:["Построение линейного уравнения для предсказания переменной Y.", "Поиск статистически значимых различий между заранее известными породами.", "Сжатие 100 признаков в 2 главные компоненты.", "Анализ времени до наступления события (например, смерти)."] },
        { q: "Какое расстояние измеряет путь 'по кварталам' (сумма абсолютных разностей координат) и является более робастным (устойчивым) к выбросам, чем Евклидово?", c:["Манхэттенское расстояние (Manhattan distance / City block)."], w:["Расстояние Махаланобиса.", "Расстояние Минковского (p=0.5).", "Косинусное расстояние.", "Кофенетическое расстояние."] },
        { q: "При иерархической кластеризации алгоритмы отличаются 'Методом связывания' (Linkage). В чем суть 'Метода Уорда' (Ward.D2)?", c:["Он объединяет те кластеры, слияние которых дает минимальный прирост внутрикластерной дисперсии (суммы квадратов отклонений)."], w:["Он ищет расстояние между двумя самыми близкими точками двух кластеров (Ближайший сосед).", "Он ищет расстояние между двумя самыми далекими точками двух кластеров (Дальний сосед).", "Он объединяет кластеры абсолютно случайным образом.", "Он считает среднее арифметическое всех расстояний между точками."] },
        { q: "Что откладывается по вертикальной оси (Высота / Height) на Дендрограмме?", c:["Мера различия (дистанция) между кластерами: чем выше узел слияния, тем сильнее отличаются объединяемые группы."], w:["Количество животных в образованном кластере.", "Процент объясненной дисперсии.", "Абсолютное значение переменной Y.", "Точность алгоритма в процентах."] },
        { q: "Как статистически сравнить качество разных методов иерархической кластеризации (например, Уорд против Среднего) для одних и тех же данных?", c:["Вычислить Кофенетическую корреляцию (связь между исходной матрицей расстояний и расстояниями на ветвях дерева)."], w:["Посчитать R-квадрат.", "Использовать критерий Хи-квадрат.", "Провести дисперсионный анализ (ANOVA).", "Посчитать индекс VIF."] },
        { q: "В чем главный концептуальный недостаток метода К-средних (K-means) по сравнению с иерархической кластеризацией?", c: ["Пользователь обязан заранее задать желаемое количество кластеров (K) до начала работы алгоритма."], w:["K-means работает исключительно с категориальными (текстовыми) данными.", "K-means строит слишком громоздкие и нечитаемые дендрограммы.", "K-means невозможно применить к стандартизированным данным.", "K-means требует наличия зависимой переменной Y."] },
        { q: "Каким образом алгоритм K-means инициирует (начинает) свою работу на первом шаге?", c:["Случайным образом размещает K 'центроидов' в пространстве данных."], w:["Ищет два самых близких объекта и объединяет их в микро-кластер.", "Делит пространство на равные квадраты сеткой.", "Вычисляет матрицу расстояний между всеми парами точек.", "Спрашивает пользователя координаты для каждого кластера."] },
        { q: "Зачем при использовании функции kmeans() в R настоятельно рекомендуется задавать аргумент `nstart` (например, nstart = 25)?", c:["Чтобы алгоритм произвел 25 случайных стартовых инициализаций центроидов и выбрал наилучший результат (с минимальным внутрикластерным разбросом), избегая локальных минимумов."], w:["Чтобы ограничить работу алгоритма 25 итерациями (защита от зависания).", "Чтобы разделить данные ровно на 25 стартовых кластеров.", "Чтобы игнорировать 25 самых сильных выбросов.", "Чтобы задействовать 25 ядер процессора для скорости."] },
        { q: "В чем заключается 'Метод Локтя' (Elbow Method) при определении оптимального числа кластеров?", c:["В поиске на графике точки (изгиба), после которой увеличение числа кластеров (K) перестает приводить к существенному снижению внутрикластерной суммы квадратов (WSS)."], w:["В поиске точки, где межкластерное расстояние падает до нуля.", "В выборе максимального значения K, которое выдержит оперативная память.", "В поиске точки пересечения кривых дисперсии и логарифма.", "В выборе K, равного квадратному корню из числа наблюдений."] },
        { q: "Как интерпретировать высокое положительное значение 'Силуэта' (Silhouette score, например +0.8) для конкретного объекта?", c:["Объект очень похож на другие объекты своего кластера и сильно отличается от объектов ближайшего соседнего кластера (идеальная кластеризация)."], w:["Объект находится на самой границе между двумя кластерами (спорный объект).", "Объект ошибочно помещен в чужой кластер.", "Объект является экстремальным выбросом.", "Объект формирует свой собственный кластер из одной точки."] }
    ];

        // ===================== DOM ЭЛЕМЕНТЫ =====================
        const searchInput = document.getElementById('searchInput');
        const cardsContainer = document.getElementById('cardsContainer');
        const noResults = document.getElementById('noResults');
        const resultsCount = document.getElementById('resultsCount');
        const statTotal = document.getElementById('statTotal');
        const statCorrect = document.getElementById('statCorrect');
        const statWrong = document.getElementById('statWrong');
        const statShown = document.getElementById('statShown');

        // ===================== ВЫЧИСЛЕНИЕ СТАТИСТИКИ =====================
        function computeGlobalStats() {
            let totalCorrect = 0;
            let totalWrong = 0;
            db.forEach(item => {
                totalCorrect += item.c.length;
                totalWrong += item.w.length;
            });
            return {
                totalQuestions: db.length,
                totalCorrect,
                totalWrong
            };
        }

        // ===================== ПОДСВЕТКА СОВПАДЕНИЙ =====================
        function highlightText(text, query) {
            if (!query || query.trim() === '') return text;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return text.replace(regex,
                '<span class="highlight">$1</span>');
        }

        // ===================== ОТРИСОВКА =====================
        function renderCards(filteredItems, query) {
            cardsContainer.innerHTML = '';

            if (filteredItems.length === 0) {
                noResults.style.display = 'block';
                resultsCount.innerHTML = '';
            } else {
                noResults.style.display = 'none';
                resultsCount.innerHTML =
                    `Найдено: <span>${filteredItems.length}</span> вопрос(ов) из ${db.length}`;
            }

            filteredItems.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                if (query && query.trim() !== '') {
                    card.classList.add('match-high');
                }

                // Вопрос
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML =
                    '<span class="q-label">Вопрос</span> ' + highlightText(item.q,
                    query);
                card.appendChild(questionDiv);

                // Секция ответов
                const answersSection = document.createElement('div');
                answersSection.className = 'answers-section';

                // Верные ответы
                if (item.c.length > 0) {
                    const correctLabel = document.createElement('div');
                    correctLabel.className = 'answer-group-label correct-label';
                    correctLabel.textContent = '✅ Верные ответы:';
                    answersSection.appendChild(correctLabel);

                    const correctList = document.createElement('div');
                    correctList.className = 'answer-list';
                    item.c.forEach(answer => {
                        const tag = document.createElement('span');
                        tag.className = 'answer-tag correct';
                        tag.innerHTML = highlightText(answer, query);
                        correctList.appendChild(tag);
                    });
                    answersSection.appendChild(correctList);
                }

                // Неверные ответы
                if (item.w.length > 0) {
                    const wrongLabel = document.createElement('div');
                    wrongLabel.className = 'answer-group-label wrong-label';
                    wrongLabel.textContent = '❌ Неверные ответы:';
                    answersSection.appendChild(wrongLabel);

                    const wrongList = document.createElement('div');
                    wrongList.className = 'answer-list';
                    item.w.forEach(answer => {
                        const tag = document.createElement('span');
                        tag.className = 'answer-tag wrong';
                        tag.innerHTML = highlightText(answer, query);
                        wrongList.appendChild(tag);
                    });
                    answersSection.appendChild(wrongList);
                }

                card.appendChild(answersSection);
                cardsContainer.appendChild(card);
            });

            // Обновить статистику показанных
            statShown.textContent = filteredItems.length;
        }

        // ===================== ФИЛЬТРАЦИЯ =====================
        function filterItems(query) {
            const q = query.trim().toLowerCase();
            if (q === '') return db;
            return db.filter(item => {
                // Поиск в вопросе
                if (item.q.toLowerCase().includes(q)) return true;
                // Поиск в верных ответах
                if (item.c.some(a => a.toLowerCase().includes(q))) return true;
                // Поиск в неверных ответах
                if (item.w.some(a => a.toLowerCase().includes(q))) return true;
                return false;
            });
        }

        // ===================== ОБНОВЛЕНИЕ ВСЕГО =====================
        function updateAll() {
            const query = searchInput.value;
            const filtered = filterItems(query);
            renderCards(filtered, query);
        }

        // ===================== ИНИЦИАЛИЗАЦИЯ =====================
        function init() {
            // Установить глобальную статистику
            const stats = computeGlobalStats();
            statTotal.textContent = stats.totalQuestions;
            statCorrect.textContent = stats.totalCorrect;
            statWrong.textContent = stats.totalWrong;
            statShown.textContent = stats.totalQuestions;

            // Отрисовать все карточки
            renderCards(db, '');

            // Слушатель ввода
            searchInput.addEventListener('input', updateAll);
        }

        // Запуск
        init();
    </script>
